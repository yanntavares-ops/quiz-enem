<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz ENEM - Matemática</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .info-box {
            text-align: center;
        }

        .info-box h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .info-box ul {
            list-style: none;
            margin-bottom: 30px;
        }

        .info-box li {
            font-size: 1.2em;
            margin: 15px 0;
            color: #555;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-counter {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        #question-text {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.3em;
            line-height: 1.6;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
            text-align: left;
            width: 100%;
        }

        .option:hover:not(.disabled) {
            background: #f0f0ff;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.8;
        }

        #next-btn {
            display: block;
            margin: 30px auto 0;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        #score-percentage {
            color: white;
            font-size: 2.5em;
            font-weight: bold;
        }

        #score-text {
            text-align: center;
            font-size: 1.3em;
            color: #333;
            margin-bottom: 30px;
        }

        #answers-review {
            margin: 30px 0;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .review-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            border-left: 5px solid #667eea;
        }

        .review-item h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .review-item p {
            color: #666;
            margin: 5px 0;
        }

        .correct-answer {
            color: #4caf50;
            font-weight: bold;
        }

        .wrong-answer {
            color: #f44336;
            font-weight: bold;
        }

        .explanation {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            header h1 {
                font-size: 2em;
            }
            
            #question-text {
                font-size: 1.1em;
            }
            
            .option {
                font-size: 1em;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Quiz ENEM - Matemática</h1>
            <p>Teste seus conhecimentos com 10 questões no estilo ENEM</p>
        </header>

        <div id="start-screen" class="screen active">
            <div class="info-box">
                <h2>Pronto para o desafio?</h2>
                <ul>
                    <li>🔢 10 questões de Matemática</li>
                    <li>⏱️ Sem limite de tempo</li>
                    <li>📊 Resultado no final</li>
                    <li>✅ Gabarito comentado</li>
                </ul>
                <button id="start-btn" class="btn-primary">COMEÇAR QUIZ</button>
            </div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="question-counter">
                Questão <span id="current-question">1</span> de <span id="total-questions">10</span>
            </div>
            
            <div id="question-container">
                <h2 id="question-text"></h2>
                <div id="options-container"></div>
            </div>
            
            <button id="next-btn" class="btn-primary" style="display: none;">PRÓXIMA QUESTÃO</button>
        </div>

        <div id="result-screen" class="screen">
            <h2 style="text-align: center; color: #333;">🎉 Resultado Final</h2>
            <div id="score-container">
                <div class="score-circle">
                    <span id="score-percentage">0%</span>
                </div>
                <p id="score-text"></p>
            </div>
            <div id="answers-review"></div>
            <button id="restart-btn" class="btn-primary">TENTAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Um comerciante comprou um produto por R$ 80,00 e deseja vendê-lo com um lucro de 25% sobre o preço de custo. Qual deve ser o preço de venda?",
                options: [
                    "R$ 95,00",
                    "R$ 100,00",
                    "R$ 105,00",
                    "R$ 110,00",
                    "R$ 120,00"
                ],
                correct: 1,
                explanation: "Lucro = 25% de R$ 80 = R$ 20. Preço de venda = R$ 80 + R$ 20 = R$ 100,00"
            },
            {
                question: "Em uma progressão aritmética (PA), o primeiro termo é 3 e a razão é 4. Qual é o décimo termo dessa PA?",
                options: [
                    "35",
                    "37",
                    "39",
                    "40",
                    "43"
                ],
                correct: 2,
                explanation: "Fórmula do termo geral: an = a1 + (n-1)r. a10 = 3 + (10-1)×4 = 3 + 36 = 39"
            },
            {
                question: "Um reservatório em forma de cubo tem aresta de 2 metros. Qual é o volume máximo de água, em litros, que ele pode conter?",
                options: [
                    "4000 L",
                    "6000 L",
                    "8000 L",
                    "10000 L",
                    "12000 L"
                ],
                correct: 2,
                explanation: "Volume = aresta³ = 2³ = 8 m³. Como 1 m³ = 1000 L, então 8 m³ = 8000 L"
            },
            {
                question: "Se log₂(x) = 5, qual é o valor de x?",
                options: [
                    "10",
                    "25",
                    "32",
                    "64",
                    "128"
                ],
                correct: 2,
                explanation: "log₂(x) = 5 significa que 2⁵ = x. 2⁵ = 32, portanto x = 32"
            },
            {
                question: "Uma pesquisa mostra que 60% dos entrevistados preferem o produto A. Se 1500 pessoas foram entrevistadas, quantas preferem o produto A?",
                options: [
                    "600",
                    "750",
                    "900",
                    "1050",
                    "1200"
                ],
                correct: 2,
                explanation: "60% de 1500 = (60/100) × 1500 = 0,6 × 1500 = 900 pessoas"
            },
            {
                question: "Qual é a área de um triângulo que tem base 8 cm e altura 5 cm?",
                options: [
                    "13 cm²",
                    "20 cm²",
                    "26 cm²",
                    "40 cm²",
                    "80 cm²"
                ],
                correct: 1,
                explanation: "Área do triângulo = (base × altura) / 2 = (8 × 5) / 2 = 40 / 2 = 20 cm²"
            },
            {
                question: "Se f(x) = 2x + 3, qual é o valor de f(5)?",
                options: [
                    "8",
                    "10",
                    "13",
                    "15",
                    "16"
                ],
                correct: 2,
                explanation: "f(5) = 2(5) + 3 = 10 + 3 = 13"
            },
            {
                question: "Uma loja oferece 15% de desconto em um produto que custa R$ 200,00. Qual é o preço com desconto?",
                options: [
                    "R$ 160,00",
                    "R$ 170,00",
                    "R$ 175,00",
                    "R$ 180,00",
                    "R$ 185,00"
                ],
                correct: 1,
                explanation: "Desconto = 15% de 200 = R$ 30. Preço final = R$ 200 - R$ 30 = R$ 170,00"
            },
            {
                question: "Qual é a probabilidade de sair um número par no lançamento de um dado comum de 6 faces?",
                options: [
                    "1/6",
                    "1/3",
                    "1/2",
                    "2/3",
                    "5/6"
                ],
                correct: 2,
                explanation: "Números pares no dado: 2, 4, 6 (3 números). Probabilidade = 3/6 = 1/2 = 50%"
            },
            {
                question: "Se um carro percorre 240 km em 3 horas, qual é sua velocidade média em km/h?",
                options: [
                    "60 km/h",
                    "70 km/h",
                    "75 km/h",
                    "80 km/h",
                    "90 km/h"
                ],
                correct: 3,
                explanation: "Velocidade média = distância / tempo = 240 km / 3 h = 80 km/h"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        let selectedOption = null;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionSpan = document.getElementById('current-question');
        const totalQuestionsSpan = document.getElementById('total-questions');
        const progressBar = document.getElementById('progress');
        const scorePercentage = document.getElementById('score-percentage');
        const scoreText = document.getElementById('score-text');
        const answersReview = document.getElementById('answers-review');

        totalQuestionsSpan.textContent = questions.length;

        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            questionText.textContent = question.question;
            optionsContainer.innerHTML = '';
            selectedOption = null;
            nextBtn.style.display = 'none';

            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = `${String.fromCharCode(65 + index)}) ${option}`;
                button.addEventListener('click', () => selectOption(index, button));
                optionsContainer.appendChild(button);
            });

            currentQuestionSpan.textContent = currentQuestionIndex + 1;
            progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
        }

        function selectOption(index, button) {
            if (selectedOption !== null) return;

            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.classList.remove('selected'));
            
            button.classList.add('selected');
            selectedOption = index;
            nextBtn.style.display = 'block';
            
            const question = questions[currentQuestionIndex];
            allOptions.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === question.correct) {
                    opt.classList.add('correct');
                }
            });

            if (selectedOption === question.correct) {
                score++;
            } else {
                button.classList.add('incorrect');
            }

            userAnswers.push({
                questionIndex: currentQuestionIndex,
                selected: selectedOption,
                correct: question.correct
            });
        }

        function showResults() {
            const percentage = (score / questions.length) * 100;
            scorePercentage.textContent = `${Math.round(percentage)}%`;
            
            let message = '';
            if (percentage >= 80) {
                message = 'Excelente! Você está muito bem preparado! 🌟';
            } else if (percentage >= 60) {
                message = 'Bom trabalho! Continue estudando! 👍';
            } else if (percentage >= 40) {
                message = 'Precisa melhorar um pouco mais! 📚';
            } else {
                message = 'Continue praticando! Você vai conseguir! 💪';
            }
            scoreText.textContent = message;

            answersReview.innerHTML = '';
            userAnswers.forEach((answer, index) => {
                const question = questions[answer.questionIndex];
                const reviewItem = document.createElement('div');
                reviewItem.className = 'review-item';
                
                const isCorrect = answer.selected === answer.correct;
                const statusIcon = isCorrect ? '✅' : '❌';
                const statusClass = isCorrect ? 'correct-answer' : 'wrong-answer';
                
                reviewItem.innerHTML = `
                    <h3>${statusIcon} Questão ${answer.questionIndex + 1}</h3>
                    <p><strong>Pergunta:</strong> ${question.question}</p>
                    <p><strong>Sua resposta:</strong> <span class="${statusClass}">${question.options[answer.selected]}</span></p>
                    <p><strong>Resposta correta:</strong> <span class="correct-answer">${question.options[answer.correct]}</span></p>
                    <div class="explanation">
                        <strong>Explicação:</strong> ${question.explanation}
                    </div>
                `;
                
                answersReview.appendChild(reviewItem);
            });

            showScreen(resultScreen);
        }

        startBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            selectedOption = null;
            showScreen(quizScreen);
            loadQuestion();
        });

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                progressBar.style.width = '100%';
                showResults();
            }
        });

        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            selectedOption = null;
            showScreen(startScreen);
        });
    </script>
</body>
</html>
